name: Website checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: website-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build and verify website
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Verify release, runtime packaging and registration recovery
        run: npm run test:deployment
      - name: Verify runtime lifecycle and pioneer name search
        run: npm run test:runtime
      - name: Verify community requests, storage and recovery
        run: npm run test:community
      - name: Build and verify static files and map behavior
        run: npm run build
        env:
          BUILD_VCS_NUMBER: ${{ github.sha }}
      - name: Run public pages and enrollment in Chrome
        run: |
          npm run test:release:browser
          npm run test:registration:browser

  operations:
    name: Verify operations, publishing and registration integration
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Set up operations Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: cms/.nvmrc
          cache: npm
          cache-dependency-path: |
            package-lock.json
            cms/package-lock.json
      - name: Install website and operations dependencies
        run: |
          npm ci --no-audit --no-fund
          npm ci --prefix cms --no-audit --no-fund
      - name: Build the website fixture
        run: npm run build
        env:
          BUILD_VCS_NUMBER: ${{ github.sha }}
      - name: Verify migrations, staff permissions, publishing, uploads and registration
        run: npm run test:operations
        env:
          OPERATIONS_BROWSER: '1'
          GUIDE_BROWSER: '1'
          EVENT_ENTRY_BROWSER: '1'

  publish:
    name: Publish only after all checks and explicit enablement
    needs: [build, operations]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.CLUB_AUTO_DEPLOY == '1'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
      - name: Trigger Flow and verify the production revision
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.CLUB_AUTO_DEPLOY == '1'
        run: node scripts/trigger-flow.mjs
        env:
          CLUB_AUTO_DEPLOY: ${{ vars.CLUB_AUTO_DEPLOY }}
          CLUB_FLOW_WEBHOOK_URL: ${{ secrets.CLUB_FLOW_WEBHOOK_URL }}
      - name: Verify the live registration service and operations console
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.CLUB_AUTO_DEPLOY == '1' && vars.CLUB_REQUIRE_BUSINESS == '1'
        run: node deploy/operations/smoke.mjs https://club.01aiedu.com "$GITHUB_SHA"
        env:
          REQUIRE_PRODUCTION: '1'

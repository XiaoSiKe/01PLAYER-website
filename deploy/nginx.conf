# 仅管理 club.01aiedu.com，不修改默认入口和其它 server 块。
server {
    listen 80;
    server_name club.01aiedu.com;
    access_log /var/log/nginx/01PLAYER.access.log;
    error_log /var/log/nginx/01PLAYER.error.log;
    location ^~ /.well-known/acme-challenge/ {
        root /var/lib/01aiclub/acme;
        try_files $uri =404;
    }
    location / { return 308 https://club.01aiedu.com$request_uri; }
}

server {
    listen 443 ssl http2;
    server_name club.01aiedu.com;
    ssl_certificate /etc/letsencrypt-01aiclub/live/01aiclub/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt-01aiclub/live/01aiclub/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    root /var/www/01PLAYER/current;
    index index.html;
    access_log /var/log/nginx/01PLAYER.access.log;
    error_log /var/log/nginx/01PLAYER.error.log;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options SAMEORIGIN always;
    location ^~ /.well-known/acme-challenge/ {
        root /var/lib/01aiclub/acme;
        default_type text/plain;
        add_header Cache-Control 'no-store' always;
        try_files $uri =404;
    }
    location ~ /\. { deny all; }
    location = /version.json {
        add_header Cache-Control 'no-store';
        try_files $uri =404;
    }
    location ^~ /assets/ {
        gzip_static on;
        gzip_vary on;
        add_header Cache-Control 'public, max-age=31536000, immutable';
        try_files $uri =404;
    }
    # The runtime installer enables the business locations in this server only.
    include /etc/01player-runtime/enabled/*.conf;
    location / {
        # Keep an unconfigured business endpoint out of the SPA and CDN cache.
        error_page 503 = @club_runtime_offline;
        if ($uri ~ "^/(api/community|admin|cms-api|_next|site-content)(/|$)") { return 503; }
        add_header Cache-Control 'no-cache';
        try_files $uri $uri/ /index.html;
    }
    location @club_runtime_offline {
        default_type application/json;
        add_header Cache-Control 'no-store' always;
        return 503 '{"error":"报名与运营服务尚未接入"}';
    }
}

# Load once in http {} via conf.d. Only locations including common-proxy.inc
# consume these budgets. Keys have bounded cardinality independent of URL/query.
map "$request_method:$uri" $club_route_class {
    default cms;
    ~^POST:/api/community/(events/[A-Za-z0-9_-]+/registrations|register-event)$ enrollment;
    ~^GET:/api/community/(events(/[A-Za-z0-9_-]+)?|event-scenes/[A-Za-z0-9_-]+)$ event_form;
    ~^POST:/api/community/registration-status$ receipt;
    ~^[^:]+:/api/community/ community;
    ~^[^:]+:/site-content/  manifest;
    ~^[^:]+:/_next/static/  next_assets;
}

# Empty keys skip the limiter. Admission for the public form, enrollment
# and the private receipt is independent even when users share one address.
map $club_route_class $club_runtime_pool {
    enrollment "";
    event_form "";
    receipt    "";
    default    $club_route_class;
}
map $club_route_class $club_enrollment {
    enrollment enrollment;
    default    "";
}
map $club_enrollment $club_enrollment_address {
    enrollment $binary_remote_addr;
    default    "";
}
map $club_route_class $club_attendee_read {
    event_form event_form;
    receipt    receipt;
    default    "";
}
map $club_attendee_read $club_attendee_read_address {
    ""      "";
    default "$club_attendee_read:$binary_remote_addr";
}
map $uri $club_community_origin {
    ~^/api/community/ community;
    default "";
}
map "$club_route_class:$request_method" $club_community_write {
    community:POST community;
    default "";
}

map "$request_method:$uri" $club_credentials {
    default                                                            "";
    ~^POST:/api/community/(login|register|account/password)/?$          community;
    ~^POST:/cms-api/staff/(login|forgot-password|reset-password)/?$     cms;
    ~^POST:/admin/login/?$                                              cms;
}

map $club_community_write $club_writer_address {
    default "";
    community $binary_remote_addr;
}

limit_req_zone  $club_runtime_pool    zone=club_requests:1m    rate=200r/s;
limit_conn_zone $club_runtime_pool    zone=club_in_flight:1m;
limit_req_zone  $club_community_write zone=club_writes:1m      rate=24r/s;
limit_req_zone  $club_writer_address  zone=club_writer_ips:2m  rate=6r/s;
limit_req_zone  $club_credentials     zone=club_credentials:1m rate=6r/s;

# Average rates bound both SQLite work and one venue's share of the worker.
limit_req_zone  $club_enrollment         zone=club_enrollments:1m    rate=64r/s;
limit_req_zone  $club_enrollment_address zone=club_enrollment_ips:2m rate=40r/s;
limit_conn_zone $club_enrollment         zone=club_enrollment_active:1m;

limit_req_zone  $club_attendee_read         zone=club_attendee_reads:1m    rate=100r/s;
limit_req_zone  $club_attendee_read_address zone=club_attendee_read_ips:2m rate=80r/s;
limit_conn_zone $club_attendee_read         zone=club_attendee_read_active:1m;
limit_conn_zone $club_community_origin      zone=club_community_active:1m;
